name: Выпуск релиза

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-24.04
          - rid: win-x64
            runner: windows-2022
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Установить зависимости Native AOT
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev
      - name: Собрать и упаковать
        shell: pwsh
        env:
          RID: ${{ matrix.rid }}
          TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = ($env:TAG -replace '^v', '') -replace '^(\d+\.\d+\.\d+)([A-Za-z][A-Za-z0-9]*)$', '$1-$2'
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw "Неподдерживаемая версия: $env:TAG" }
          $destination = 'package/database'
          dotnet publish 'DatabasePlugin/DatabasePlugin.csproj' -c Release -r $env:RID -o $destination "-p:Version=$version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $path = Join-Path $destination 'manifest.json'
          $manifest = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
          $manifest.version = $env:TAG -replace '^v', ''
          foreach ($assembly in $manifest.assemblies) {
            if (!(Test-Path -LiteralPath (Join-Path $destination $assembly) -PathType Leaf)) { throw "Нет сборки из manifest.json: $assembly" }
          }
          $manifest | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $path -Encoding utf8
          New-Item -ItemType Directory -Path archives | Out-Null
          $name = 'host-database-plugin' + "-$env:TAG-$env:RID"
          if ($IsWindows) {
            Compress-Archive -Path $destination -DestinationPath "archives/$name.zip"
          } else {
            tar -czf "archives/$name.tar.gz" -C package 'database'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: archives/*
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Опубликовать релиз
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ ! "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes "${flags[@]}"
